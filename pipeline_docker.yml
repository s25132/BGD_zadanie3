version: "3.9"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: my-airflow:medallion
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: "supersekretny_jwt_123456789"
    AIRFLOW__API__SECRET_KEY: "supersekretny_api_123456789"

    DB_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/medallion
    JDBC_URL: jdbc:postgresql://postgres:5432/medallion
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    CHUNK_SIZE: "100000"
    LOAD_MODE: incremental
    SPARK_MASTER: spark://spark-master:7077

    KAFKA_BOOTSTRAP: kafka:9092
    KAFKA_TOPIC: raw-transactions
    KAFKA_GROUP_ID: raw-consumer

    PYTHONPATH: "/opt/airflow:/opt/airflow/src"

  volumes: &airflow-common-volumes
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data

x-airflow-depends-on: &airflow-depends-on
  postgres:
    condition: service_healthy
  airflow-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    container_name: medallion_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medallion
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
    - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s


  spark-master:
    image: apache/spark:latest
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8081:8081"

  spark-worker:
    image: apache/spark:latest
    container_name: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    command: airflow db migrate

  airflow-api-server:
    <<: *airflow-common
    container_name: airflow-api-server
    ports:
      - "8080:8080"
    depends_on: *airflow-depends-on
    command: airflow api-server

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on: *airflow-depends-on
    command: airflow scheduler

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    depends_on: *airflow-depends-on
    command: airflow dag-processor
 
  kafka-consumer:
    <<: *airflow-common
    container_name: kafka-consumer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    command: python /opt/airflow/src/kafka/consumer.py

  kafka-producer:
    <<: *airflow-common
    container_name: kafka-producer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["producer"]
    environment:
      <<: *airflow-common-env
      DATA_FILE: /opt/airflow/data/transactions_03_24_2.csv
    command: python /opt/airflow/src/kafka/producer.py

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medallion_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: